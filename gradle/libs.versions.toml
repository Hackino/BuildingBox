# Versions target Compose Multiplatform 1.11 / current KMP. If Gradle sync complains about a
# specific artifact, bump it here — the catalog is the single place to adjust.
[versions]
agp = "8.9.1"
kotlin = "2.2.20"
composeMultiplatform = "1.11.0"
androidx-activity = "1.10.1"
androidx-core = "1.13.1"
androidx-splashscreen = "1.0.1"
androidx-lifecycle = "2.9.0"          # org.jetbrains.androidx.lifecycle (KMP)
navigation = "2.9.0"                  # org.jetbrains.androidx.navigation (KMP)
coroutines = "1.10.2"
serialization = "1.8.1"
datetime = "0.7.1"                   # aligned with the version Compose material3 1.9 pulls in
koin = "4.1.0"
ktor = "3.1.3"
gitliveFirebase = "2.1.0"             # dev.gitlive firebase KMP wrappers
pdfbox = "2.0.31"                     # desktop PDF report export (JVM only)
pdfboxGraphics2d = "0.43"            # Graphics2D → PDFBox bridge (mirrors Android Canvas)
settings = "1.3.0"                    # multiplatform-settings
googleServices = "4.4.2"
crashlytics = "3.0.3"                 # firebase-crashlytics gradle plugin
firebaseBom = "33.7.0"                # Android-native Crashlytics
compileSdk = "35"
minSdk = "24"
targetSdk = "35"

[libraries]
# Coroutines / serialization
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }   # Desktop Dispatchers.Main (AWT/Swing EDT)
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# Lifecycle + Navigation (KMP)
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

# GitLive Firebase (Android + iOS)
gitlive-firebase-auth = { module = "dev.gitlive:firebase-auth", version.ref = "gitliveFirebase" }
gitlive-firebase-database = { module = "dev.gitlive:firebase-database", version.ref = "gitliveFirebase" }
gitlive-firebase-common = { module = "dev.gitlive:firebase-common", version.ref = "gitliveFirebase" }

# Ktor (Desktop REST client)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Android-native Firebase (Crashlytics)
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

# Settings (token/role cache)
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "settings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "settings" }

# Desktop-only PDF report export (mirrors the Android android.graphics PDF).
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
pdfbox-graphics2d = { module = "de.rototor.pdfbox:graphics2d", version.ref = "pdfboxGraphics2d" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }
crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
