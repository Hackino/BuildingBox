name: Build apps

# Builds the signed Android APK and the desktop installers (Windows/macOS/Linux).
# All credentials come from GitHub Actions secrets (configure them in your fork's
# Settings → Secrets and variables → Actions). No secret is ever stored in the repo.

# Manual only: runs when you press "Run workflow" on the Actions tab.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — verify required secrets BEFORE any checkout/JDK/build work.
  # If a required secret is missing, this fails immediately and (because every
  # build job `needs` it) nothing else runs — no runner time wasted on setup.
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are present
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          DESKTOP_FIREBASE_PROPERTIES_BASE64: ${{ secrets.DESKTOP_FIREBASE_PROPERTIES_BASE64 }}
        run: |
          missing=""
          for name in \
            GOOGLE_SERVICES_JSON_BASE64 \
            KEYSTORE_BASE64 \
            KEYSTORE_STORE_PASSWORD \
            KEYSTORE_KEY_ALIAS \
            KEYSTORE_KEY_PASSWORD \
            DESKTOP_FIREBASE_PROPERTIES_BASE64; do
            # Indirect expansion: check whether the env var of that name is empty.
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing"
            echo "::error::Add them in Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "All required secrets are present."

  # ---------------------------------------------------------------------------
  # Android — signed release APK (ubuntu)
  # ---------------------------------------------------------------------------
  android:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --- Recreate the gitignored secret files from Actions secrets ---

      - name: Restore google-services.json (this client's Firebase)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GS" ]; then echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing"; exit 1; fi
          # tr strips any line-wrapping/whitespace so wrapped base64 still decodes.
          set +o pipefail
          printf '%s' "$GS" | tr -d '[:space:]' | base64 -d > composeApp/google-services.json
          rc=$?
          set -o pipefail
          if [ "$rc" -ne 0 ] || ! head -c1 composeApp/google-services.json | grep -q '{'; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 did not decode to JSON. Re-create it as single-line base64:  openssl base64 -A -in composeApp/google-services.json | pbcopy"
            exit 1
          fi

      - name: Restore keystore (shared signing key)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; fi
          set +o pipefail
          printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > composeApp/buildingbox.keystore
          rc=$?
          set -o pipefail
          if [ "$rc" -ne 0 ] || [ ! -s composeApp/buildingbox.keystore ]; then
            echo "::error::KEYSTORE_BASE64 did not decode. Re-create it as single-line base64:  openssl base64 -A -in composeApp/buildingbox.keystore | pbcopy"
            exit 1
          fi

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=buildingbox.keystore
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BuildingBox-android-${{ github.run_number }}
          path: composeApp/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Clean up secret files
        if: always()
        run: rm -f composeApp/google-services.json composeApp/buildingbox.keystore keystore.properties

  # ---------------------------------------------------------------------------
  # Desktop — native installers, one per OS (jpackage)
  #   windows-latest → .msi/.exe   macos-latest → .dmg   ubuntu-latest → .deb
  # ---------------------------------------------------------------------------
  desktop:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest,   name: macos }
          - { os: ubuntu-latest,  name: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # use bash on every OS (Git Bash on Windows runners)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # google-services.json is not needed to package the desktop app, but the
      # google-services Gradle plugin is applied — restore it when the secret
      # exists so project configuration never trips. Non-fatal if absent.
      - name: Restore google-services.json (optional)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GS" ]; then
            set +o pipefail
            printf '%s' "$GS" | tr -d '[:space:]' | base64 -d > composeApp/google-services.json 2>/dev/null \
              || echo "::warning::Could not decode GOOGLE_SERVICES_JSON_BASE64; continuing (desktop build does not require it)."
            set -o pipefail
          fi

      # The desktop app reads desktop-firebase.properties at runtime (Firebase REST
      # config). Bake it into the package so the shipped installer is ready to run.
      # Optional: skip silently if the secret isn't set.
      - name: Restore desktop-firebase.properties (optional)
        env:
          DF: ${{ secrets.DESKTOP_FIREBASE_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$DF" ]; then
            # Write into the BUNDLED resources dir (appResourcesRootDir) so jpackage
            # packages it into the app and loadConfig() finds it on any device.
            mkdir -p composeApp/desktop-resources/common
            set +o pipefail
            printf '%s' "$DF" | tr -d '[:space:]' | base64 -d > composeApp/desktop-resources/common/desktop-firebase.properties 2>/dev/null \
              && grep -q 'firebase.apiKey' composeApp/desktop-resources/common/desktop-firebase.properties \
              || echo "::warning::Could not decode DESKTOP_FIREBASE_PROPERTIES_BASE64; the packaged app will need the file supplied at runtime."
            set -o pipefail
          else
            echo "::notice::DESKTOP_FIREBASE_PROPERTIES_BASE64 not set; packaging without it (app needs the file at runtime)."
          fi

      # jpackage needs WiX 3 to produce Windows installers.
      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset*' -Directory | Select-Object -First 1
          if ($wix) { Add-Content -Path $env:GITHUB_PATH -Value "$($wix.FullName)\bin" }

      # jpackage needs these to produce a .deb on Linux.
      - name: Install jpackage deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Package desktop distribution (minified release)
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:packageReleaseDistributionForCurrentOS --no-daemon --stacktrace

      # Windows produces TWO installer kinds — upload them as separate artifacts.
      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BuildingBox-desktop-windows-msi-${{ github.run_number }}
          path: composeApp/build/compose/binaries/main-release/msi/*.msi
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Windows EXE
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BuildingBox-desktop-windows-exe-${{ github.run_number }}
          path: composeApp/build/compose/binaries/main-release/exe/*.exe
          retention-days: 30
          if-no-files-found: warn

      # macOS (.dmg) and Linux (.deb) — one installer each.
      - name: Upload desktop installer (${{ matrix.name }})
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: BuildingBox-desktop-${{ matrix.name }}-${{ github.run_number }}
          # Release packages land under main-release/ (ProGuard + trimmed runtime).
          path: |
            composeApp/build/compose/binaries/main-release/dmg/*.dmg
            composeApp/build/compose/binaries/main-release/deb/*.deb
          retention-days: 30
          if-no-files-found: warn

      - name: Clean up secret files
        if: always()
        run: rm -f composeApp/google-services.json composeApp/desktop-firebase.properties
