# Desktop build talks to Firebase over REST (it can't read google-services.json).
# Copy this to  composeApp/desktop-firebase.properties  (gitignored) and fill in real values.
# Values: Firebase Console → Project settings → General, and Realtime Database.

firebase.apiKey=YOUR_WEB_API_KEY
firebase.databaseUrl=https://YOUR_PROJECT_ID-default-rtdb.YOUR_REGION.firebasedatabase.app
firebase.projectId=YOUR_PROJECT_ID
